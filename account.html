<!DOCTYPE html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241B4B"><link rel="icon" href="/icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="/icons/favicon-48.png" sizes="48x48"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/fredoka-latin-700.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/nunito-latin-800.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--ink:#241B4B;--mut:#5a6480;--sky:#4cb8ff;--sun:#FFE45C;--ok:#3fbf6b;--bad:#d43b3b;--soft:#eef3fb}
*{box-sizing:border-box;min-width:0}body{margin:0;min-height:100vh;background:linear-gradient(#4cb8ff,#a8e1ff) fixed;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 60px}
.brand{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);text-decoration:none;color:var(--ink);width:fit-content}
.brand b{font:800 20px Rubik,Fredoka,sans-serif}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 0 var(--ink);margin-top:16px}
h1{font:800 clamp(26px,6vw,36px)/1.1 Rubik,Fredoka,sans-serif;margin:0 0 8px}h2{font:800 22px Rubik,Fredoka,sans-serif;margin:0 0 8px}
label{display:block;font-weight:800;margin:12px 0 4px}input{width:100%;font:16px Nunito,sans-serif;padding:12px;border:3px solid var(--ink);border-radius:12px;background:var(--soft)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button,.btn{display:inline-block;min-height:48px;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);font:800 16px Nunito,sans-serif;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;margin-top:14px}
button.sec,.btn.sec{background:#fff}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{margin:0;background:#fff}.tabs button[aria-selected=true]{background:var(--sun)}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin:8px 0 0}.note{color:var(--mut);font-size:14px}
.kid{border:3px solid var(--ink);border-radius:16px;padding:14px;margin-top:12px;background:var(--soft)}
.kid h3{margin:0;font:800 20px Rubik,Fredoka,sans-serif;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font:800 13px Nunito,sans-serif;background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px}.pill.free{background:#9aa6c0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.stats div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center}.stats b{display:block;font:800 22px Rubik,Fredoka,sans-serif}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.code{font:800 28px Outfit;letter-spacing:4px;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;display:inline-block}
.price{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:520px){.price{grid-template-columns:1fr}}
.price>div{border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--soft)}.price b.big{font:800 30px Outfit;display:block}
footer{text-align:center;color:var(--ink);font-weight:800;font-size:13px;margin-top:28px}footer a{color:var(--ink)}
.ok{color:#178a3e}.wrep{margin-top:12px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px}.wrh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.wrep h4{margin:0;font:800 19px Rubik,Fredoka,sans-serif}.wrep h5{margin:12px 0 4px;font:800 16px Rubik,Fredoka,sans-serif}.wl{margin:0;padding-left:20px}.wl li{margin:3px 0}
@media print{body.printing{background:#fff}body.printing .wrap>*:not(#app),body.printing #app>.card:not(:has(.printme)),body.printing .kid>*:not(.printme):not(h3),body.printing .kid h3 .pill,body.printing .wrep:not(.printme),body.printing [data-print]{display:none!important}body.printing #app>.card{border:0;box-shadow:none}body.printing .printme{border:0}body.printing .kid{border:0;background:#fff}}
</style><title>Account | VocaBobby</title><link rel="stylesheet" href="/vb-light.css"></head><body><div class="wrap"><a class="brand" href="/" style="background:none;border:0;box-shadow:none;padding:0" aria-label="VocaBobby home"><img src="/icons/vo-icon.svg" alt="" width="44" height="44"><img class="wmsvg" src="/icons/wordmark-v6.svg" alt="VocaBobby" width="150" height="38"></a>
<div id="app"><div class="card"><p>Loading…</p></div></div><footer>© 2026 Thinking Hack Education · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · WhatsApp +65 9003 0002</footer></div>
<script>{
const $=s=>document.querySelector(s),app=$('#app');
const api=(p,o={})=>fetch(p,{...o,credentials:'same-origin',headers:{'x-vo':'1','Content-Type':'application/json'}}).then(async r=>({ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))})).catch(()=>({ok:false,j:{error:'No connection. Try again.'}}));
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
async function boot(){const me=(await api('/api/auth')).j.user;if(!me)return loggedOut();if(me.type==='kid')return kidView(me);return dash()}
function loggedOut(tab=location.hash==='#parent'||location.hash==='#unlock'?'parent':'kid'){
  app.innerHTML=`<div class="card"><h1>Log in to VocaBobby</h1><p class="note">Players log in with their family code, player name and 4-digit PIN. Parents set this up once.</p>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='kid'}" id="tk">I'm a player</button><button role="tab" aria-selected="${tab!=='kid'}" id="tp">I'm a parent</button></div><div id="pane"></div></div>`;
  $('#tk').onclick=()=>loggedOut('kid');$('#tp').onclick=()=>loggedOut('parent');
  const pane=$('#pane');
  if(tab==='kid'){pane.innerHTML=`<form id="f"><label for="c">Family code</label><input id="c" autocomplete="off" autocapitalize="characters" maxlength="6" required><label for="n">Player name</label><input id="n" autocomplete="username" maxlength="14" required><label for="p">PIN</label><input id="p" type="password" inputmode="numeric" pattern="\\d{4}" maxlength="4" autocomplete="current-password" required><p class="err" id="e"></p><button>Play</button></form>`;
    $('#f').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'kid',code:$('#c').value,nick:$('#n').value,pin:$('#p').value})});if(r.ok)location.href='/';else $('#e').textContent=r.j.error||'Try again.'};return}
  pane.innerHTML=`<div class="tabs" style="margin-top:12px"><button id="si" aria-selected="true" class="sec">Log in</button><button id="su" class="sec">Create account</button></div><div id="pf"></div>`;
  const login=()=>{$('#pf').innerHTML=`<form id="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><p class="err" id="e"></p><button>Log in</button></form>`;
    $('#f').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'login',email:$('#em').value,password:$('#pw').value})});if(r.ok)dash();else $('#e').textContent=r.j.error||'Try again.'}};
  const signup=()=>{$('#pf').innerHTML=`<form id="f"><label for="em">Parent email</label><input id="em" type="email" autocomplete="email" required><label for="pw">Password (8+ characters)</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required>
    <label style="font-weight:700;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="ok" required style="width:22px;height:22px;margin-top:2px"> I am the parent or guardian and agree to the <a href="/terms.html">terms</a> and <a href="/privacy.html">privacy notice</a>.</label><p class="err" id="e"></p><button>Create parent account</button></form>`;
    $('#f').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'signup',email:$('#em').value,password:$('#pw').value,consent:$('#ok').checked})});if(r.ok)dash();else $('#e').textContent=r.j.error||'Try again.'}};
  $('#si').onclick=()=>{$('#si').setAttribute('aria-selected','true');$('#su').setAttribute('aria-selected','false');login()};$('#su').onclick=()=>{$('#su').setAttribute('aria-selected','true');$('#si').setAttribute('aria-selected','false');signup()};
  login();
}
function kidView(me){app.innerHTML=`<div class="card"><h1>Hi <span id="nm"></span>!</h1><p>You're logged in. Your progress saves to your account.</p><a class="btn" href="/">Play VocaBobby</a> <button class="sec" id="lo">Log out</button></div>`;$('#nm').textContent=me.nick;$('#lo').onclick=out}
async function out(){await api('/api/auth',{method:'POST',body:JSON.stringify({action:'logout'})});loggedOut()}
async function dash(){
  const r=await api('/api/family');if(!r.ok)return loggedOut('parent');const f=r.j;const paid=f.paid&&f.paid.until>Date.now();
  app.innerHTML=`${q.get('paid')?'<div class="card"><h2>Thank you!</h2><p>Payment received. The PSLE Edition unlocks as soon as Stripe confirms it, usually within a minute.</p></div>':''}${q.get('cancel')?'<div class="card"><p>Payment cancelled. Nothing was charged.</p></div>':''}
  <div class="card"><h1>Parent dashboard</h1><p>Your family code: <span class="code" id="cd"></span></p><p class="note">Players log in at this site with the family code, their player name and PIN, on any phone, tablet or computer.</p></div>
  <div class="card"><h2>Players</h2><div id="kids"></div>
   <form id="af" style="margin-top:14px"><h2 style="font-size:18px">Add a player</h2><p class="note">Use a nickname, not a full real name. It appears on the leaderboard.</p><label for="nk">Player name (2–14 letters or numbers)</label><input id="nk" maxlength="14" autocomplete="off" required><label for="pn">4-digit PIN</label><input id="pn" inputmode="numeric" pattern="\\d{4}" maxlength="4" required><p class="err" id="ae"></p><button>Add player</button></form></div>
  <div class="card" id="mylists"><h2>My Lists</h2><p>Turn spelling lists, school topics or any text into a playable Quest world. Your children play it on their map.</p><a class="btn" href="/lists.html" style="display:inline-block;font:800 17px Rubik,Fredoka,sans-serif;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:#7be0c3;color:var(--ink);box-shadow:0 4px 0 var(--ink);text-decoration:none">＋ Create a list</a><h2 style="font-size:18px;margin-top:16px">For teachers</h2><p class="note">Make a list, tick "Share with a code", and give the 6-letter code to your class. Pupils type it on the World map under My Quests.</p></div>
  <div class="card" id="unlock"><h2>PSLE Edition</h2><p>${paid?(f.paid.plan==='family'?'<b>Family Pass active</b> until '+new Date(f.paid.until).toLocaleDateString('en-SG')+'.':'Active for some players until '+new Date(f.paid.until).toLocaleDateString('en-SG')+'.'):'VocaBobby is free: all six worlds, pets, bosses, mini-games and the leaderboard. The PSLE Edition unlocks PSLE Kingdom, the exam world built from real PSLE papers with exam-style runs and the Exam King boss,'}</p>
   <div class="price"><div><b class="big">S$29.90</b>1 player · 1 year<div id="pc"></div></div><div><b class="big">S$59.90</b>Family Pass · up to 3 players · 1 year<br><button id="bf">Buy Family Pass</button></div></div><p class="err" id="be"></p><p class="note" id="snote">Secure checkout by Stripe (card or PayNow). One-off payment, no auto-renewal.</p>
   <div id="paynow" hidden><h3 style="margin:14px 0 6px">Pay by PayNow</h3><ol class="pn"><li>PayNow <b>S$29.90</b> (1 player) or <b>S$59.90</b> (Family Pass, up to 3 players) to <b>+65 9003 0002</b>.</li><li>Use your family code <b class="code" data-code></b> as the payment reference.</li><li>Tap a WhatsApp button below so we can match your payment. We unlock the PSLE Edition as soon as it arrives, usually the same day.</li></ol><div id="wa"></div><p class="note">One-off payment for one year. No auto-renewal.</p></div></div>
  <div class="card" id="support"><h2>Support Miss Christine ☕</h2><p>I built VocaBobby for my students. Enjoying your child's progress? Any amount helps me keep building new worlds, bosses and words.</p>
   ${f.sup?`<p class="ok"><b>Thank you for your support!</b> Your players have their ${({any:'🏅 Supporter badge',10:'🏅 Supporter badge and Golden Cape',20:'🏅 Supporter badge, Golden Cape, Thank-You Phoenix and Early access'})[f.sup]}.</p>`:''}
   <ol class="pn"><li>PayNow any amount to <b>+65 9003 0002</b>: <b>S$5</b>, <b>S$10</b>, <b>S$20</b> or anything you like.</li><li>Reference: <b class="code" style="font-size:18px;letter-spacing:1px;word-break:break-all"><span data-code></span>SUPPORT</b></li><li>Tap a button below so I can say thank you.</li></ol>
   <div id="swa"></div>
   <p class="note">As a thank-you, your players get cosmetic rewards only (no game advantage): any amount, a 🏅 Supporter badge and a note from Miss Christine; S$10+, an exclusive Golden Cape; S$20+, the rare Thank-You Phoenix pet and Early access to new features.</p>
   <label style="display:flex;gap:10px;align-items:center;font-weight:700;margin-top:8px"><input type="checkbox" id="wall" style="width:auto;min-height:0" ${f.wall?'checked':''}> Show my players' nicknames on the Supporters Wall</label><p class="note" id="wallm">Off by default. Only nicknames are shown, never real names.</p></div>
  <div class="card"><button class="sec" id="lo">Log out</button></div>`;
  $('#cd').textContent=f.code;$('#lo').onclick=out;
  document.querySelectorAll('#support [data-code]').forEach(e=>e.textContent=f.code);
  {const sb=$('#swa');[['S$5',5],['S$10',10],['S$20',20],['another amount',0]].forEach(([t,v])=>{const a=document.createElement('a');a.className='btn';a.style.margin='4px 6px 4px 0';a.target='_blank';a.rel='noopener';a.textContent='WhatsApp: I sent '+t;a.href='https://wa.me/6590030002?text='+encodeURIComponent(`Hi Miss Christine, I've sent ${v?'S$'+v:'a'} PayNow to support VocaBobby. Family code: ${f.code} (reference ${f.code}SUPPORT).`);sb.appendChild(a)});}
  $('#wall').onchange=async e=>{const r=await api('/api/family',{method:'POST',body:JSON.stringify({action:'wall',on:e.target.checked})});$('#wallm').textContent=r.ok?(e.target.checked?'Your players will appear on the Supporters Wall once you are a supporter.':'Hidden from the Supporters Wall.'):'Could not save. Try again.'};
  $('#kids').innerHTML=f.children.length?f.children.map((k,i)=>`<div class="kid"><h3><span data-n="${i}"></span><span class="pill ${k.paid?'':'free'}">${k.paid?'PSLE Edition':'Free'}</span></h3>
    <div class="stats"><div><b>${k.seen}</b>words met</div><div><b>${k.mastered}</b>mastered</div><div><b>${k.accuracy==null?'–':k.accuracy+'%'}</b>first-try right</div><div><b>${k.days}</b>days played</div></div>
    ${k.toRevise.length?`<p class="note"><b>Words to revise:</b> <span data-r="${i}"></span></p>`:''}<p class="note">${k.lastPlayed?'Last played '+new Date(k.lastPlayed).toLocaleString('en-SG'):'Not played yet'}</p>
    <button data-play="${k.id}">Play as this player on this device</button>${k.report?`<div class="wrep" id="wr${i}"><div class="wrh"><h4>Weekly report</h4><span class="note">${new Date(k.report.from).toLocaleDateString('en-SG',{day:'numeric',month:'short'})} to ${new Date(k.report.to).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'})}</span></div>
    <div class="stats"><div><b>${k.report.met}</b>words met this week</div><div><b>${k.report.mastered}</b>words mastered this week</div><div><b>${k.report.metAll}</b>words met in total</div><div><b>${k.report.masteredAll}</b>mastered in total</div></div>
    <p class="note">Mastered means your child got the word right again on a later review, days apart, and spelt it correctly.</p>
    <h5>Tricky words</h5><ul class="wl" data-tr="${i}"></ul><h5>What to practise next</h5><ul class="wl" data-nx="${i}"></ul><h5>Dinner-table questions</h5><ol class="wl" data-dp="${i}"></ol>
    <button class="sec" data-print="${i}">Print this report</button></div>`:''}</div>`).join(''):'<p class="note">No players yet. Add one below.</p>';
  f.children.forEach((k,i)=>{const n=document.querySelector(`[data-n="${i}"]`);n.textContent=k.nick;const R=k.report;if(R){const fill=(sel,arr,fn,empty)=>{const el=document.querySelector(sel);if(!el)return;if(!arr.length){const li=document.createElement('li');li.className='note';li.textContent=empty;el.appendChild(li);return}arr.forEach(x=>{const li=document.createElement('li');fn(li,x);el.appendChild(li)})};
    const wm=(li,x)=>{const b=document.createElement('b');b.textContent=x.w;li.appendChild(b);if(x.m)li.appendChild(document.createTextNode(': '+x.m))};
    fill(`[data-tr="${i}"]`,R.tricky,wm,'None this week. Nice!');fill(`[data-nx="${i}"]`,R.next,wm,'Play a run to get new suggestions.');fill(`[data-dp="${i}"]`,R.prompts,(li,x)=>li.textContent=x,'');}const rv=document.querySelector(`[data-r="${i}"]`);if(rv)rv.textContent=k.toRevise.join(', ')});
  document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const el=document.getElementById('wr'+b.dataset.print);document.querySelectorAll('.wrep').forEach(x=>x.classList.remove('printme'));el.classList.add('printme');document.body.classList.add('printing');print();setTimeout(()=>document.body.classList.remove('printing'),500)});
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=async()=>{const r=await api('/api/family',{method:'POST',body:JSON.stringify({action:'playAs',childId:b.dataset.play})});if(r.ok)location.href='/'});
  $('#pc').innerHTML=f.children.filter(k=>!k.paid).map(k=>`<button data-buy="${k.id}" class="sec">Unlock for <span></span></button>`).join('')||'<p class="note">Add a player first.</p>';
  f.children.filter(k=>!k.paid).forEach((k,i)=>{document.querySelectorAll('[data-buy] span')[i].textContent=k.nick});
  if(!f.stripe&&!paid){document.querySelector('#unlock .price').hidden=true;$('#snote').hidden=true;$('#paynow').hidden=false;document.querySelectorAll('[data-code]').forEach(e=>e.textContent=f.code);
    const wa=(plan,nick)=>'https://wa.me/6590030002?text='+encodeURIComponent(`Hi Miss Christine, I've PayNow-ed for VocaBobby PSLE Edition. Family code: ${f.code}. Plan: ${plan}${nick?' for player '+nick:''}.`);
    const box=$('#wa');box.innerHTML='';const mk=(t,u)=>{const a=document.createElement('a');a.className='btn';a.style.margin='4px 6px 4px 0';a.href=u;a.target='_blank';a.rel='noopener';a.textContent=t;box.appendChild(a)};
    f.children.filter(k=>!k.paid).forEach(k=>mk('WhatsApp: paid S$29.90 for '+k.nick,wa('1 player, S$29.90',k.nick)));mk('WhatsApp: paid S$59.90 Family Pass',wa('Family Pass, S$59.90'));}
  const buy=async(plan,childId)=>{$('#be').textContent='Opening secure checkout…';const r=await api('/api/checkout',{method:'POST',body:JSON.stringify({plan,childId})});if(r.ok&&r.j.url)location.href=r.j.url;else $('#be').textContent=r.j.error||'Could not open checkout.'};
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy('child',b.dataset.buy));$('#bf').onclick=()=>buy('family');
  $('#af').onsubmit=async e=>{e.preventDefault();const r=await api('/api/family',{method:'POST',body:JSON.stringify({action:'addChild',nick:$('#nk').value.trim(),pin:$('#pn').value})});if(r.ok)dash();else $('#ae').textContent=r.j.error||'Try again.'};
  if(location.hash==='#unlock')$('#unlock').scrollIntoView();
}
boot();
}</script></body></html>
