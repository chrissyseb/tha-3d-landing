<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <symbol id="logo-mark" viewBox="0 0 120 120">
    <defs>
      <!-- Highlighter stroke filter for rough, chisel-tip edges -->
      <filter id="highlighter-stroke" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
        <feMorphology operator="dilate" radius="0.5"/>
        <feGaussianBlur stdDeviation="0.3"/>
      </filter>

      <!-- Chisel tip marker shape -->
      <filter id="chisel-tip" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="4" result="chiselNoise"/>
        <feDisplacementMap in="SourceGraphic" in2="chiselNoise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
        <feMorphology operator="erode" radius="0.3"/>
        <feGaussianBlur stdDeviation="0.4"/>
      </filter>

      <!-- Rough edge filter -->
      <filter id="rough-edges" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="roughness"/>
        <feDisplacementMap in="SourceGraphic" in2="roughness" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>

    <!-- Background (transparent for icon) -->

    <!-- ICON: Stylized TH monogram with highlighter strokes, centered -->
    <g transform="translate(7.5, 7.5)" filter="url(#highlighter-stroke)">
      <!-- Hexagon background with chisel-tip strokes -->
      <path d="M45,0 L90,0 L112.5,22.5 L90,45 L45,45 L22.5,22.5 Z"
            fill="none" stroke="#3FA7E1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#chisel-tip)" opacity="0.95"/>

      <!-- Inner accent strokes - Pink -->
      <path d="M35,12 L55,12" stroke="#F0487A" stroke-width="6" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.9"/>
      <path d="M35,24 L65,24" stroke="#F0487A" stroke-width="6" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.75"/>
      <path d="M35,36 L60,36" stroke="#F0487A" stroke-width="5" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.6"/>

      <!-- Inner accent strokes - Green -->
      <path d="M55,18 L55,40" stroke="#3FBF4F" stroke-width="6" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.9"/>
      <path d="M70,15 L70,35" stroke="#3FBF4F" stroke-width="4" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.6"/>

      <!-- Inner accent strokes - Yellow -->
      <path d="M75,8 L75,38" stroke="#EEF03A" stroke-width="5" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.95"/>

      <!-- Inner accent strokes - Orange -->
      <path d="M40,38 L70,38" stroke="#F7661C" stroke-width="5" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.85"/>
      <path d="M45,42 L65,42" stroke="#F7661C" stroke-width="4" stroke-linecap="round" filter="url(#chisel-tip)" opacity="0.6"/>

      <!-- TH Letterforms as negative space / cutout style -->
      <g fill="#16181D" filter="url(#rough-edges)">
        <!-- T -->
        <path d="M38,8 L62,8 L62,16 L52,16 L52,32 L46,32 L46,16 L38,16 Z"/>
        <!-- H -->
        <path d="M68,8 L76,8 L76,38 L68,38 Z"/>
        <path d="M84,8 L92,8 L92,38 L84,38 Z"/>
        <path d="M68,20 L92,20 L92,28 L68,28 Z"/>
      </g>

      <!-- Highlighter swipe behind the hexagon (yellow underline style) -->
      <path d="M10,52 Q55,40 100,52"
            fill="none" stroke="#EEF03A" stroke-width="16" stroke-linecap="round"
            filter="url(#chisel-tip)" opacity="0.35"/>

      <!-- Additional blue swipe -->
      <path d="M10,58 Q55,48 100,58"
            fill="none" stroke="#3FA7E1" stroke-width="12" stroke-linecap="round"
            filter="url(#chisel-tip)" opacity="0.25"/>
    </g>
  </symbol>
</svg>