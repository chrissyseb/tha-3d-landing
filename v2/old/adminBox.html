<section class="sheet" id="adminBox" hidden><div class="sheet-inner">
    <h2 style="font-size:22px">Approve Students</h2>
    <p id="adminWho" class="hint"></p>
    <div class="row" id="adminLogin"><input type="password" id="adminKey" placeholder="Admin key (saved on this phone)" style="flex:1 1 200px;min-width:0;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px"><button class="btn ghost" id="adminSave" type="button">Save key</button></div>
    <div class="row"><button class="btn primary" id="adminApprove" type="button" hidden>Approve</button></div>
    <ul id="adminList" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"></ul>
    <h3 style="font-size:18px;margin-top:8px">Promo Codes</h3>
    <div class="row"><input type="text" id="pcCode" placeholder="Code, e.g. PSLE2026" style="flex:1 1 140px;min-width:0;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;text-transform:uppercase"><input type="number" id="pcEssays" value="2" min="1" max="10" aria-label="Bonus essays" style="width:80px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px"><input type="number" id="pcUses" value="100" min="1" aria-label="Number of uses" style="width:90px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px"><button class="btn ghost" id="pcAdd" type="button">Create</button></div>
    <span class="hint">Bonus essays per person, then how many people can use it.</span>
    <ul id="promoList" style="margin:0;padding-left:18px"></ul>
    <h3 style="font-size:18px;margin-top:8px">Messages <span class="counter" id="msgCount"></span></h3>
    <ul id="msgList" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px"></ul>
    <h3 style="font-size:18px;margin-top:8px">Leads <span class="counter" id="leadCount"></span></h3>
    <span class="hint">Challenge entrants who agreed to WhatsApp contact. Tap a number to message them.</span>
    <div class="row"><button class="btn ghost" id="leadCsv" type="button">Download as spreadsheet</button></div>
    <ul id="leadList" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px"></ul>
  </div></section>
