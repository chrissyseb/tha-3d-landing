<!DOCTYPE html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241B4B"><link rel="icon" href="/icons/favicon.svg" type="image/svg+xml"><link rel="icon" href="/icons/favicon-48.png" sizes="48x48"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180"><link rel="manifest" href="/manifest.webmanifest"><title>My Lists | VocaBobby</title>
<link rel="preload" href="/fonts/fredoka-latin-700.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/nunito-latin-800.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css"><style>
:root{--ink:#241B4B;--mut:#5a6480;--sky:#4cb8ff;--sun:#FFE45C;--ok:#3fbf6b;--bad:#d43b3b;--soft:#eef3fb}
*{box-sizing:border-box;min-width:0}body{margin:0;min-height:100vh;background:linear-gradient(#4cb8ff,#a8e1ff) fixed;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px max(4vw,14px) 60px}
.brand{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 var(--ink);text-decoration:none;color:var(--ink);width:fit-content}
.brand b{font:800 20px Rubik,Fredoka,sans-serif}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:clamp(16px,4vw,26px);box-shadow:0 6px 0 var(--ink);margin-top:16px}
h1{font:800 clamp(26px,6vw,36px)/1.1 Rubik,Fredoka,sans-serif;margin:0 0 8px}h2{font:800 22px Rubik,Fredoka,sans-serif;margin:0 0 8px}
label{display:block;font-weight:800;margin:12px 0 4px}input{width:100%;font:16px Nunito,sans-serif;padding:12px;border:3px solid var(--ink);border-radius:12px;background:var(--soft)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button,.btn{display:inline-block;min-height:48px;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);font:800 16px Nunito,sans-serif;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-decoration:none;margin-top:14px}
button.sec,.btn.sec{background:#fff}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{margin:0;background:#fff}.tabs button[aria-selected=true]{background:var(--sun)}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin:8px 0 0}.note{color:var(--mut);font-size:14px}
.kid{border:3px solid var(--ink);border-radius:16px;padding:14px;margin-top:12px;background:var(--soft)}
.kid h3{margin:0;font:800 20px Rubik,Fredoka,sans-serif;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font:800 13px Nunito,sans-serif;background:var(--ok);color:#fff;border-radius:99px;padding:3px 10px}.pill.free{background:#9aa6c0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.stats div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center}.stats b{display:block;font:800 22px Outfit}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.code{font:800 28px Outfit;letter-spacing:4px;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;display:inline-block}
.price{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:520px){.price{grid-template-columns:1fr}}
.price>div{border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--soft)}.price b.big{font:800 30px Outfit;display:block}
footer{text-align:center;color:var(--ink);font-weight:800;font-size:13px;margin-top:28px}footer a{color:var(--ink)}
.ok{color:#178a3e}
textarea{width:100%;font:16px Nunito,sans-serif;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;min-height:110px}
.tabs{display:flex;gap:8px;margin:6px 0 4px}.tabs button{flex:1;font:800 15px Rubik,Fredoka,sans-serif;padding:10px;border:3px solid var(--ink);border-radius:12px;background:var(--soft);color:var(--ink)}.tabs button.on{background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{font:800 15px Nunito;padding:8px 12px;border:3px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink)}.chip.on{background:#7be0c3}
.wl{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}.wl li{border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--soft)}.wl b{font:800 18px Rubik,Fredoka,sans-serif}.wl small{color:var(--mut);display:block}.wl .need{background:#fff4d6}.wl input{margin-top:6px}.wl .x{float:right;border:0;background:none;font:800 20px Outfit;color:var(--mut)}
.btn{display:inline-block;font:800 17px Rubik,Fredoka,sans-serif;padding:12px 18px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink);text-decoration:none;margin:12px 8px 0 0;cursor:pointer}.btn.alt{background:#fff}.btn.go2{background:#7be0c3}
.code{font:800 30px Rubik,Fredoka,sans-serif;letter-spacing:.18em;background:var(--soft);border:3px dashed var(--ink);border-radius:14px;padding:8px 14px;display:inline-block}
.row{display:flex;gap:10px;align-items:center}.row label{margin:0;font-weight:700}.row input[type=checkbox]{width:22px;height:22px}
.err{color:var(--bad);font-weight:800}.note{color:var(--mut);font-size:14px}.mine li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chk{border:3px solid var(--ink);border-radius:14px;background:#fff4d6;padding:10px 12px;margin:10px 0}.chk ul{margin:6px 0 0;padding-left:20px}</style><link rel="stylesheet" href="/vb-light.css"><script src="/skin.js"></script></head><body><div class="wrap"><a class="brand" href="/" style="background:none;border:0;box-shadow:none;padding:0" aria-label="VocaBobby home"><img src="/icons/vo-icon.svg" alt="" width="44" height="44"><img class="wmsvg" src="/icons/wordmark-v6.svg" alt="VocaBobby" width="150" height="38"></a><div id="app"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o={})=>fetch(p,{...o,credentials:'same-origin',headers:{'x-vo':'1','Content-Type':'application/json'}}).then(async r=>({ok:r.ok,status:r.status,j:await r.json().catch(()=>({}))})).catch(()=>({ok:false,j:{error:'Network problem. Try again.'}}));
const QK='vo_quests',getQ=()=>{try{return JSON.parse(localStorage.getItem(QK))||[]}catch(e){return[]}},setQ=a=>{try{localStorage.setItem(QK,JSON.stringify(a.slice(0,30)))}catch(e){}};
let me=null,words=[],edit=null,mode='type';
async function init(){const r=await api('/api/lists');me=r.ok&&r.j.lists?r.j:null;list()}
function list(){
  const mine=me?me.lists:getQ().filter(q=>!q.code);
  $('#app').innerHTML=`<div class="card"><h1>My Lists</h1><p>Turn any words into your own <b>Quest</b> world: same obby, word gates, bosses and Spell-it. Type your words or paste a paragraph and we build the rest.</p>
  ${mine.length?`<ul class="wl mine">${mine.map((l,i)=>`<li><span><b>${esc(l.name)}</b><small>${l.words.length} words${l.code?` · code <b>${esc(l.code)}</b>${l.shared?' · shared':' · private'}`:' · on this device'}</small></span><span><button class="btn go2" data-p="${i}">Play</button><button class="btn alt" data-e="${i}">Edit</button></span></li>`).join('')}</ul>`:'<p class="note">No lists yet.</p>'}
  <button class="btn" id="new">＋ Create a list</button>
  <p class="note">${me?(me.limit>1?`You can make up to ${me.limit} lists, 100 words each.`:'Free accounts get 1 custom list. A Family or PSLE Pass unlocks up to 20.'):'Playing as a guest: you can keep 1 list on this device. <a href="/account.html">Log in</a> to save and share lists with a code.'}</p></div>
  <div class="card"><h2>Got a Quest code?</h2><p class="note">Teachers and friends can share a 6-letter code.</p><div class="row"><input id="qc" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"><button class="btn" id="qj" style="margin:0">Open</button></div><p class="err" id="qe"></p></div>`;
  $('#new').onclick=()=>{if(!me&&mine.length){$('#new').insertAdjacentHTML('afterend','<p class="err">Guests can keep 1 list. Log in to make more.</p>');return}edit=null;words=[];builder()};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(mine[+b.dataset.p]));
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const l=mine[+b.dataset.e];edit=l;words=l.words.map(e=>({w:e[0],m:(l.need||[]).includes(e[0])?'':e[2]}));builder()});
  $('#qj').onclick=async()=>{const c=$('#qc').value.trim().toUpperCase();const r=await api('/api/lists?code='+encodeURIComponent(c));if(!r.ok)return $('#qe').textContent=r.j.error||'Not found.';play(r.j.list)};
}
function play(l){const q=getQ().filter(x=>!(x.code&&x.code===l.code)&&!(!x.code&&!l.code));q.unshift(l);setQ(q);location.href='/?quest='+(l.code||'')+'#quests'}
function builder(){
  $('#app').innerHTML=`<div class="card" id="bld"><h1>${edit?'Edit list':'Create a list'}</h1>
  <label for="nm">List name</label><input id="nm" maxlength="40" placeholder="e.g. Ocean words" value="${esc(edit?edit.name:'')}">
  <label for="th">Theme (optional)</label><input id="th" maxlength="40" placeholder="e.g. Science, Chapter 3" value="${esc(edit?edit.theme:'')}">
  <div class="tabs"><button id="t1" class="${mode==='type'?'on':''}">Type words</button><button id="t2" class="${mode==='para'?'on':''}">Paste a paragraph</button></div>
  <div id="inp"></div><ul class="wl" id="wl"></ul>
  ${me?`<div class="row" style="margin-top:12px"><input type="checkbox" id="sh" ${edit&&edit.shared?'checked':''}><label for="sh">Share with a code (friends, classmates, students)</label></div>`:''}
  <p class="err" id="er"></p><button class="btn" id="sv">Build my Quest</button><button class="btn alt" id="bk">Back</button></div>`;
  $('#t1').onclick=()=>{mode='type';builder()};$('#t2').onclick=()=>{mode='para';builder()};
  if(mode==='type'){$('#inp').innerHTML=`<label for="tw">Words (one per line, or separated by commas)</label><textarea id="tw" placeholder="glacier, curious, ancient"></textarea><button class="btn alt" id="ad">Add words</button>`;
    $('#ad').onclick=()=>{$('#tw').value.split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(addW);$('#tw').value='';draw()}}
  else{$('#inp').innerHTML=`<label for="tp">Paste a paragraph or a page of text</label><textarea id="tp" placeholder="Paste a story, article or chapter…"></textarea><button class="btn alt" id="ex">Find words</button><div class="chips" id="ch"></div><button class="btn alt" id="ak" hidden>Add ticked words</button>`;
    $('#ex').onclick=async()=>{window.lastCtx=$('#tp').value;const r=await api('/api/lists',{method:'POST',body:JSON.stringify({action:'extract',text:$('#tp').value})});if(!r.ok)return $('#er').textContent=r.j.error;
      $('#ch').innerHTML=r.j.words.map(x=>`<button class="chip ${x.tick?'on':''}" data-w="${esc(x.w)}">${esc(x.w)}</button>`).join('')||'<p class="note">No words found. Try a longer text.</p>';
      $('#ch').querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.classList.toggle('on'));$('#ak').hidden=!r.j.words.length};
    $('#ak').onclick=()=>{$('#ch').querySelectorAll('.chip.on').forEach(c=>addW(c.dataset.w));$('#ch').innerHTML='';$('#ak').hidden=true;draw()}}
  $('#bk').onclick=list;$('#sv').onclick=save;draw();
}
function addW(w){if(words.length>=100||words.some(x=>x.w===w))return;words.push({w,m:''})}
function draw(){const need=new Set((window.lastNeed)||[]);
  $('#wl').innerHTML=words.map((x,i)=>`<li class="${need.has(x.w)&&!x.m?'need':''}"><button class="x" data-x="${i}" aria-label="Remove ${esc(x.w)}">×</button><b>${esc(x.w)}</b>${need.has(x.w)&&!x.m?'<small>Needs a meaning: type one below</small>':''}${(window.lastCheck||[]).includes(x.w)?'<small>Check meaning?</small>':''}<input data-m="${i}" maxlength="120" placeholder="${need.has(x.w)?'Type a meaning':'Meaning (optional: we fill it in)'}" value="${esc(x.m)}"></li>`).join('')+(words.length?`<p class="note">${words.length}/100 words</p>`:'');
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.x,1);draw()});
  document.querySelectorAll('[data-m]').forEach(b=>b.oninput=()=>{words[+b.dataset.m].m=b.value})}
async function save(){
  const p={name:$('#nm').value,theme:$('#th').value,words,shared:!!($('#sh')&&$('#sh').checked)};if(window.lastCtx)p.ctx=window.lastCtx.slice(0,6000);
  if(edit&&edit.code)p.code=edit.code;
  const r=await api('/api/lists',{method:'POST',body:JSON.stringify({action:me?'save':'build',...p})});
  if(!r.ok){$('#er').textContent=r.j.error||'Something went wrong.';if(r.j.upgrade)$('#er').insertAdjacentHTML('beforeend',' <a href="/account.html#unlock">See passes</a>');return}
  const l=r.j.list;window.lastNeed=l.need;window.lastCheck=l.check||[];
  if(!me){const q=getQ().filter(x=>x.code);q.unshift(l);setQ(q)}
  if(l.need.length){edit=l;words=l.words.map(e=>({w:e[0],m:l.need.includes(e[0])?'':e[2]}));builder();$('#er').textContent=`Saved! ${l.need.length} word${l.need.length>1?'s need':' needs'} a meaning. Type ${l.need.length>1?'them':'it'} in and press Build again.`;return}
  if(me){const r2=await api('/api/lists');me=r2.ok&&r2.j.lists?r2.j:me}
  $('#app').innerHTML=`<div class="card"><h1>Quest ready!</h1><p><b>${esc(l.name)}</b> · ${l.words.length} words. It's now a world on your map.</p>${(l.check||[]).length?`<div class="chk"><b>Check meaning?</b><p class="note">We weren't sure which meaning you wanted for these words. Edit the list to type your own.</p><ul>${l.words.filter(e=>l.check.includes(e[0])).map(e=>`<li><b>${esc(e[0])}</b>: ${esc(e[2])}</li>`).join('')}</ul></div>`:''}${l.code&&l.shared?`<p>Share this code:</p><div class="code">${esc(l.code)}</div>`:l.code?'<p class="note">Private: only your family can play it. Edit the list to share it with a code.</p>':''}<br><button class="btn go2" id="pl">Play now</button><button class="btn alt" id="bk">My Lists</button></div>`;
  $('#pl').onclick=()=>play(l);$('#bk').onclick=list;
}
init();
</script></body></html>
