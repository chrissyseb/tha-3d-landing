<path d="M-48 0 Q-40 36 -10 50 Q6 58 18 46 Q44 28 48 0Z" fill="url(#rockP)" stroke="#241B4B" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="0" cy="0" rx="50" ry="12" fill="url(#ice)" stroke="#241B4B" stroke-width="3"/>
<path d="M-30 -2 L-16 -34 L-2 -2Z M0 -2 L14 -26 L28 -2Z" fill="#E6F4FD" stroke="#241B4B" stroke-width="3" stroke-linejoin="round"/><path d="M-16 -34 L-2 -2 H-10Z M14 -26 L28 -2 H20Z" fill="#9FC9EE"/>
<circle cx="-30" cy="-30" r="9" fill="url(#coin)" stroke="#241B4B" stroke-width="2.5"/><text x="-30" y="-26" font-family="Fredoka,Nunito,sans-serif" font-weight="800" font-size="11" text-anchor="middle" fill="#8A5A0E">Z</text></g>
