<path d="M-50 0 Q-42 36 -12 54 Q4 62 18 50 Q46 30 50 0Z" fill="url(#rock)" stroke="#241B4B" stroke-width="3" stroke-linejoin="round"/>
<ellipse cx="0" cy="0" rx="52" ry="13" fill="url(#grass)" stroke="#241B4B" stroke-width="3"/>
<g stroke="#241B4B" stroke-width="2.5" stroke-linejoin="round"><rect x="-18" y="-12" width="36" height="10" fill="#B8C2A2"/><rect x="-13" y="-21" width="26" height="9" fill="#A7B38E"/><rect x="-8" y="-29" width="16" height="8" fill="#96A37D"/></g><rect x="-4" y="-10" width="8" height="8" fill="#241B4B"/>
<path d="M-18 -12 q-4 8 0 14 M18 -12 q4 8 0 14" stroke="#3B9B3A" stroke-width="3" fill="none"/>
<use href="#tr" transform="translate(-36 -2) scale(.85)"/><use href="#tr" transform="translate(34 -2) scale(.95)"/></g>
