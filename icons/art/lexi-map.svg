<g opacity=".55"><ellipse cx="300" cy="74" rx="18" ry="5" fill="#9DD946"/><path d="M282 74 q8 16 18 16 q10 0 18 -16Z" fill="#B9A4E8"/><ellipse cx="560" cy="200" rx="16" ry="4" fill="#9DD946"/><path d="M544 200 q8 14 16 14 q8 0 16 -14Z" fill="#B9A4E8"/></g>
<g fill="#FFE45C" stroke="#241B4B" stroke-width="2" stroke-linejoin="round"><path d="M160 72l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M440 50l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z"/></g>
