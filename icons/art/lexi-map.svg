<path d="M22 -4 v-20 M22 -24 q-10 -2 -14 4 M22 -24 q10 -2 14 4 M22 -24 q-4 -9 -12 -8 M22 -24 q4 -9 12 -8" stroke="#2F7F2A" stroke-width="4" fill="none" stroke-linecap="round"/></g>
<!-- island 3 jungle temple -->
