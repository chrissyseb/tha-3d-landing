<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/icons/vo-icon.svg" type="image/svg+xml"><link rel="icon" href="/icons/favicon-48.png" sizes="48x48"><link rel="apple-touch-icon" href="/icons/apple-180.png"><meta name="description" content="Vocab Obby by Thinking Hack Education. 500 Primary 6 vocabulary words, learnt through a blocky obby game with pets, a Word Boss and Speed Runs. Created by Miss Christine."><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1b2140"><link rel="apple-touch-icon" href="/icons/apple-180.png"><link rel="stylesheet" href="/vo.css"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Obby | Thinking Hack Education</title><meta property="og:title" content="Vocab Obby by Thinking Hack Education"><meta property="og:description" content="500 PSLE vocabulary words, learnt through a blocky obby game. Created by Miss Christine, Exam Preparation Specialist.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a polished kids' game with real PSLE teaching inside; confident, bright, never babyish
   IDEA: an obby in the sky; every right answer is a jump to the next floating block
   PICTURE: a layered voxel sky world behind everything, the player's blocky avatar standing on a platform
   COLOUR/TYPE: Thinking Hack hexagon colours as flat fields on a deep ink frame; Outfit for display, Nunito for text
   LAYOUT: brand bar, stat strip, one main card per screen, chunky 3D buttons */
:root{color-scheme:light;
--ink:#1b2140;--ink2:#2b3463;--mut:#5d6585;--paper:#ffffff;--soft:#f2f5fb;--line:#dfe5f1;
--sky:#3fb4e8;--sky2:#8fd6f5;--lime:#9dd946;--sun:#ffc642;--orng:#fa895d;--pink:#ed598c;--plum:#b15fd7;--blue:#4aa4e6;--ok:#2fbf71;--bad:#ef4f5f;
--r:18px;--sh:0 6px 0 var(--ink);--s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;
--fd:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif}
:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:var(--ink);font:500 17px/1.5 var(--fb);overflow-x:clip;min-height:100vh}
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--sky)}
.scene svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:max(100%,1400px);height:100%}
.wrap{max-width:720px;margin:0 auto;padding:var(--s3) max(4vw,14px) 120px;position:relative}
/* brand */
.brand{display:flex;align-items:center;gap:var(--s2);background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);padding:10px 16px;box-shadow:var(--sh);margin-bottom:var(--s3)}
.brand .lg{width:44px;height:44px;flex:none}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.wmk{height:34px;width:auto;max-width:100%;display:block;fill:var(--ink)}
.bt span{font:700 13px/1.2 var(--fb);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hud */
.hud{display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center;margin-bottom:var(--s3)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font:700 14px/1.2 var(--fd);white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.pill svg{width:22px;height:22px;flex:none}
.pill b{font-weight:800}
.sp{flex:1}
.ib{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);min-height:40px;padding:4px 14px;border-radius:999px;font:700 14px var(--fd);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.ib svg{width:18px;height:18px}
/* type */
h1{font:800 clamp(38px,9vw,60px)/.95 var(--fd);letter-spacing:-1px;color:#fff;margin:0;text-shadow:0 4px 0 var(--ink)}
h1 span{display:block;font-size:.42em;letter-spacing:.18em;text-transform:uppercase;margin-top:8px;color:var(--sun)}
.lead{color:var(--ink);font:600 16px/1.45 var(--fb);margin:var(--s2) 0 0;max-width:46ch}
.word{font:800 clamp(34px,8vw,52px)/1.02 var(--fd);letter-spacing:-.5px;margin:var(--s2) 0 var(--s1);color:var(--ink);overflow-wrap:anywhere}
.q{font:700 clamp(19px,3.6vw,23px)/1.45 var(--fb);margin:var(--s2) 0 var(--s4)}
.q u{text-decoration-color:var(--pink);text-decoration-thickness:4px;text-underline-offset:5px}
.blank{display:inline-block;min-width:5em;border-bottom:4px solid var(--pink);vertical-align:-2px}
/* buttons */
button{font:800 17px/1.25 var(--fb);min-height:52px;border-radius:14px;border:3px solid var(--ink);cursor:pointer;padding:12px 18px;color:var(--ink);background:var(--paper);transition:transform .07s,box-shadow .07s;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)!important}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;background:var(--lime);color:var(--ink);font:800 24px var(--fd);box-shadow:0 7px 0 var(--ink);border-radius:18px}
.big svg{width:30px;height:30px}
.big.alt{background:var(--sun)}
.go{display:block;width:100%;margin-top:var(--s4);background:var(--sun);font:800 20px var(--fd);box-shadow:0 6px 0 var(--ink);min-height:60px}
/* home */
.hero{position:relative;background:var(--sky2);border:3px solid var(--ink);border-radius:24px;box-shadow:var(--sh);overflow:hidden;padding:var(--s4) var(--s4) 0;margin-bottom:var(--s4);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:end}
.hero .txt{padding-bottom:var(--s4)}
.hero .stage{position:relative;width:150px;height:200px;align-self:end}
.hero .stage .plat{position:absolute;left:6px;right:6px;bottom:0;height:46px;width:calc(100% - 12px)}
.hero .stage .av{position:absolute;left:50%;bottom:38px;transform:translateX(-50%)}
.hero .stage .pt{position:absolute;right:-6px;bottom:40px}
.world{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s2);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font:700 13px var(--fd)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.menu .big{grid-column:1/-1}
.sec{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;background:var(--paper);box-shadow:var(--sh);padding:12px 14px;min-height:76px;border-radius:18px}
.sec .ico{flex:none;width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center}
.sec .ico svg{width:26px;height:26px}
.sec .lbl{display:flex;flex-direction:column;min-width:0}
.sec .lbl b{font:800 16px/1.2 var(--fd)}
.sec small{color:var(--mut);font:700 13px/1.3 var(--fb)}
.c1{background:var(--lime)}.c2{background:var(--sun)}.c3{background:var(--orng)}.c4{background:var(--pink)}.c5{background:var(--plum)}.c6{background:var(--blue)}.c7{background:#7fd9cf}.c8{background:#ffd9a8}
/* card */
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:clamp(18px,4.5vw,32px);box-shadow:var(--sh);position:relative}
.card+.card{margin-top:var(--s3)}
.tag{display:inline-flex;align-items:center;gap:6px;font:800 13px/1 var(--fd);letter-spacing:.02em;padding:7px 12px;border-radius:999px;background:var(--sun);border:2px solid var(--ink);color:var(--ink)}
.tag.new{background:var(--pink);color:#fff}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:var(--s1);flex-wrap:wrap}
.combo{font:800 14px var(--fd);color:var(--orng)}
/* options */
.opts{display:grid;gap:var(--s2)}
.opt{display:block;width:100%;text-align:left;background:var(--soft);box-shadow:0 4px 0 var(--ink);font:700 17px/1.35 var(--fb);padding:14px 16px;border-radius:14px}
@media(hover:hover){.opt:not(:disabled):hover{background:#e6f4fd}}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.teach{margin-top:var(--s3);border-radius:16px;border:3px solid var(--ink);background:#fff7e2;padding:var(--s3)}
.teach p{margin:0 0 8px}.teach p:last-child{margin:0}
.conf{margin-top:var(--s2);padding-top:var(--s2);border-top:2px dashed #e7d7ad;font-size:15px}.conf b{color:var(--pink)}
.inp{width:100%;font:800 24px var(--fd);padding:14px 16px;border-radius:14px;border:3px solid var(--ink);background:var(--soft);color:var(--ink);letter-spacing:2px}
.inp:focus{outline:4px solid var(--sun);outline-offset:2px}
/* obby progress */
.obby{display:flex;align-items:flex-end;gap:6px;height:96px;margin:0 0 var(--s3);padding:0 2px}
.blk{flex:1;position:relative;border:3px solid var(--ink);border-radius:6px;background:#fff;box-shadow:inset 0 -6px 0 #0000001a;opacity:.38}.blk.done,.blk.fin{opacity:1}.blk:has(.av){opacity:1}
.blk:nth-child(6n+1){background:var(--lime)}.blk:nth-child(6n+2){background:var(--sun)}.blk:nth-child(6n+3){background:var(--orng)}.blk:nth-child(6n+4){background:var(--pink)}.blk:nth-child(6n+5){background:var(--plum)}.blk:nth-child(6n){background:var(--blue)}
.blk.fin{background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/12px 12px}
.blk svg{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);overflow:visible}
@media(prefers-reduced-motion:no-preference){.blk .av{animation:hop .45s ease-out}}
@keyframes hop{40%{transform:translateY(-14px)}}
/* gems */
.gems{display:inline-flex;gap:4px;vertical-align:middle}
.gem{width:14px;height:16px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.gem.on:nth-child(1){background:var(--lime)}.gem.on:nth-child(2){background:var(--sun)}.gem.on:nth-child(3){background:var(--orng)}.gem.on:nth-child(4){background:var(--pink)}.gem.on:nth-child(5){background:var(--plum)}
/* boss, golden, timer */
.boss{display:flex;align-items:center;gap:var(--s2);background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;margin:0 0 var(--s3);box-shadow:0 5px 0 #0d1024}
.boss .tag{background:var(--bad);color:#fff;border-color:#fff}
.boss .hp{flex:1;height:18px;border:2px solid #fff;border-radius:999px;background:#3a1b2a;overflow:hidden}
.boss .hp i{display:block;height:100%;background:var(--bad);transition:width .3s}
.boss b{font:800 14px var(--fd);white-space:nowrap}
.boss .hearts{display:flex;gap:3px}.boss .hearts svg{width:20px;height:20px;display:block}
.boss .hearts .lost{opacity:.25;filter:grayscale(1)}
.bubbles{margin:14px 0 0;text-align:center}
.bubtitle{font:800 18px var(--fd);margin:0 0 10px}
.bubrow{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.bub{width:84px;min-height:96px;border-radius:999px 999px 24px 24px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font:800 13px var(--fd);text-shadow:0 1px 0 rgba(0,0,0,.35);animation:bubIn .35s cubic-bezier(.3,1.6,.5,1) both,bubFloat 1.6s ease-in-out .35s infinite alternate;cursor:pointer}
.bub svg{width:46px;height:46px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.bub:nth-child(2){animation-delay:.06s,.5s}.bub:nth-child(3){animation-delay:.12s,.65s}.bub:nth-child(4){animation-delay:.18s,.8s}
.b-fire{background:radial-gradient(circle at 35% 25%,#ffd36b,#ff7a1f 55%,#d9361b)}
.b-water{background:radial-gradient(circle at 35% 25%,#bff0ff,#3fb2f5 55%,#1f6fd1)}
.b-zap{background:radial-gradient(circle at 35% 25%,#fff7a8,#ffd21f 55%,#e08a00)}
.b-star{background:conic-gradient(from 0deg,#ff5d8f,#ffb020,#ffe14a,#3ddc84,#3fb2f5,#8b5cf6,#ff5d8f)}
.bub.picked{transform:scale(1.12)!important;animation:none!important;outline:4px solid #fff;outline-offset:2px}.bub:disabled{cursor:default}.bub:disabled:not(.picked){opacity:.35!important;animation:none!important}
.bub .wk{font-size:10px;background:#fff;color:var(--ink);text-shadow:none;border-radius:999px;padding:0 6px;border:2px solid var(--ink)}
@keyframes bubIn{from{transform:scale(0) translateY(20px);opacity:0}to{transform:none;opacity:1}}
@keyframes bubFloat{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.victory,.ko{margin:14px 0 0;padding:14px;border-radius:16px;border:3px solid var(--ink);text-align:center}
.victory{background:linear-gradient(135deg,#ffe48a,#ffb020);animation:bubIn .4s both}
.victory b,.ko b{font:800 26px var(--fd);display:block}
.ko{background:#ffe1e1}.ko p{margin:6px 0 10px}.ko .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.ko .row .go{margin:0;width:auto;flex:1;min-width:130px}
.wmk{margin:14px 0 6px}.kingdoms .psle button{background:linear-gradient(90deg,#5b2c8f,#8a4fd1);color:#fff}.kingdoms .psle small{color:#f3e6ff}
.holdbtn{display:block;margin:12px auto 0;min-height:52px;padding:8px 18px;border-radius:14px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:#ffe14a;color:#1b2140;font:800 16px var(--fd)}
.holdbtn small{display:block;font:700 12px var(--fb,Nunito);opacity:.8}
.bubbles.charged .bub{box-shadow:0 0 0 4px #ffe14a,0 5px 0 var(--ink)}
.comboname{display:inline-block;font:900 26px var(--fd);color:var(--cc);-webkit-text-stroke:1.5px #1b2140;animation:bubIn .35s}
.charge{font-size:16px;line-height:1}
.tipq{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--ink);background:#fff;font:800 15px var(--fd);flex:none}
.tips{margin:8px 0 0;border:3px solid var(--ink);border-radius:16px;background:#fffdf2;padding:12px 14px;box-shadow:0 4px 0 var(--ink)}
.tips ul{margin:6px 0 8px;padding-left:18px}.tips li{margin:3px 0;font-size:14px}.tips .go{margin-top:4px}
.giantwin b{font-size:28px}
@media(prefers-reduced-motion:reduce){.bub{animation:none}.victory{animation:none}.comboname{animation:none}}
.gold{border-color:#b98500;background:#fffbea}
.gold .tag:first-child{background:var(--sun)}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;font:800 40px var(--fd)}
/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:var(--s2)}
.match .opt{min-height:60px;font-size:15px;padding:10px 12px}
.match .opt.sel{background:var(--sun)}
.match .opt.done{visibility:hidden}
/* grids: shop, pets, badges */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--s2)}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--soft);border:3px solid var(--ink);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--ink);font:700 14px/1.3 var(--fb);min-height:0}
.item svg{display:block;margin:0 auto 4px}
.item b{font:800 15px/1.2 var(--fd)}
.item small{color:var(--mut);font-weight:700}
.item.on{background:#fff3c4}
.item.lock{opacity:.55;box-shadow:none}
.rar{display:inline-block;font:800 12px var(--fd);padding:3px 10px;border-radius:999px;border:2px solid var(--ink);color:#fff}
.r0{background:#8a95a5}.r1{background:var(--blue)}.r2{background:var(--plum)}.r3{background:var(--orng)}.r4{background:linear-gradient(90deg,#ff8a3d,#ffc642)}.supb{font-size:.9em;margin-left:3px}.ea{font:800 11px var(--fd);background:#ffc642;color:#1b2140;border-radius:99px;padding:2px 8px;margin-left:6px}
.egg{display:inline-block}
@media(prefers-reduced-motion:no-preference){.egg{animation:wob .5s infinite alternate}}
@keyframes wob{to{transform:rotate(8deg)}}
.eggs3{grid-template-columns:repeat(3,minmax(0,1fr))}
/* recap */
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin:var(--s3) 0}
.stat div{background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:12px 6px;text-align:center;font:700 13px var(--fb);color:var(--mut)}
.stat b{display:block;font:800 28px/1.1 var(--fd);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:10px 6px;border-bottom:2px solid var(--line);vertical-align:top}
.search{width:100%;font:600 16px var(--fb);padding:13px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--soft);color:var(--ink);margin:var(--s2) 0}
ol.how{padding:0;margin:var(--s3) 0 0;list-style:none;display:grid;gap:var(--s2);counter-reset:h}
ol.how li{counter-increment:h;display:block;position:relative;min-height:60px;background:var(--soft);border-radius:14px;padding:12px 12px 12px 62px}
ol.how li::before{content:counter(h);position:absolute;left:12px;top:12px;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:3px solid var(--ink);background:var(--sun);font:800 17px var(--fd)}
/* fx */
.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font:800 clamp(24px,6vw,36px)/1.15 var(--fd);max-width:90vw;text-align:center;color:var(--sun);text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink);pointer-events:none;animation:up .9s forwards;z-index:5}
@keyframes up{to{transform:translate(-50%,-140%);opacity:0}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.foot{text-align:center;color:var(--ink);font:700 12px/1.5 var(--fb);margin:var(--s5) auto 0;max-width:52ch;background:#ffffffcc;border-radius:12px;padding:8px 12px}
@media(max-width:520px){.menu{grid-template-columns:1fr}.hero{grid-template-columns:minmax(0,1fr) 104px;padding:var(--s3) var(--s3) 0;gap:var(--s1)}.hero .stage{width:104px;height:150px}.hero .stage .av{width:60px;height:93px}.hero .stage .pt svg{width:30px;height:30px}.hero .txt{padding-bottom:var(--s3)}.lead{font-size:15px}.bt span{white-space:normal}.match{grid-template-columns:1fr 1fr}.wmk{height:28px}.pill{font-size:13px}.stat b{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* one compact stat bar */
.hud{flex-wrap:wrap;gap:0;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:4px;overflow:hidden}
.hud .pill{border:0;box-shadow:none;background:none;border-radius:10px;padding:6px 8px;gap:5px;font-size:14px;flex:none}
.hud .pill+.pill{border-left:2px solid var(--line);border-radius:0}
.hud .ib{border:0;box-shadow:none;background:var(--soft);min-height:38px;padding:4px 10px;border-radius:10px;font-size:13px;flex:none}
.hud .ib+.ib{margin-left:4px}
@media(max-width:720px){.wrap{padding-top:max(76px,calc(env(safe-area-inset-top) + 64px))}}
@media(max-width:520px){.hud .xp{display:none}}
@media(max-width:400px){.hud .pill{padding:6px 6px;font-size:13px}.hud .pill svg{width:18px;height:18px}.hud .ib{padding:4px 8px}}
.rankline{margin:10px 0 0;font-weight:800;background:var(--soft);border-radius:12px;padding:8px 12px;display:inline-block}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}.tab{min-height:40px;padding:6px 12px;border-radius:999px;background:var(--soft);font:800 14px var(--fb,Nunito),sans-serif;box-shadow:none}.tab.on{background:var(--ink,#1b2140);color:#fff}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}.lb li{display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--soft)}
.lb .rk{font:800 18px var(--fd);text-align:center}.lb .who{display:flex;align-items:flex-end;gap:2px}.lb .nk{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb .sc{white-space:nowrap;font-size:14px}
.lb li.p1{background:#ffe7a3}.lb li.p2{background:#e6ebf2}.lb li.p3{background:#f6d4b4}.lb li.mine{outline:3px solid var(--ink,#1b2140)}
.linkbtn{background:none;border:0;box-shadow:none;padding:0;min-height:0;text-decoration:underline;font:inherit;color:inherit;cursor:pointer}
.bonuscard{margin-top:16px;border-radius:16px;border:3px solid var(--ink);background:linear-gradient(135deg,#ffe27a,#ffc642);padding:14px;box-shadow:0 4px 0 var(--ink)}
.bonuscard b{font:800 20px var(--fd)}.bonuscard .row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.bonuscard .row button{flex:1;min-width:130px}

function myRank(field='weekXp'){const rows=boardRows(field);const i=rows.findIndex(r=>r.id===LB.me);if(i<0)return null;return{rank:i+1,me:rows[i],above:i>0?rows[i-1]:null,n:rows.length}}
function rankLine(){if(!LB.ready||!S.nick)return'';const r=myRank('weekXp');if(!r||!r.me.v)return'<p class="rankline">Play a run to get on this week’s board!</p>';
  return r.above?`<p class="rankline">You’re <b>#${r.rank}</b> this week, <b>${r.above.v-r.me.v+1} XP</b> behind #${r.rank-1}. Go!</p>`:`<p class="rankline">You’re <b>#1</b> this week. Defend your spot!</p>`}
async function lbInit(){
  try{
    const [db,user]=await Promise.all([VOC.use('db'),VOC.use('user')]);
    if(!db||!user)return;
    LB.db=db;LB.me=await user.id();if(!LB.me)return;
    const to=setTimeout(()=>{if(!LB.ready){LB.ready=true;LB.rows=[];refreshLB()}},10000);
    LB.unsub=db.collection('scores').onSnapshot(snap=>{clearTimeout(to);
      const docs=(snap&&snap.docs)||snap||[];LB.rows=[];
      for(const d of docs){const v=typeof d.data==='function'?d.data():(d.data||d);if(!v)continue;const id=d.id||v.id;if(!id)continue;
        const nick=typeof v.nick==='string'&&nickOk(v.nick)?v.nick:'Player';const e=v.psle&&typeof v.psle==='object'?v.psle:(v.xp!=null?v:null);if(!e)continue;LB.rows.push({id,nick,world:Number.isInteger(v.world)&&v.world>=0&&v.world<6?v.world:0,xp:e.xp,weekXp:e.weekXp,wk:e.wk,speedBest:e.speedBest,mastered:e.mastered,sup:['any','10','20'].includes(v.sup)?v.sup:'',av:safeAv(v.av),pet:Number.isInteger(v.pet)&&v.pet>=0&&v.pet<PETS.length?v.pet:-1})}
      LB.ready=true;refreshLB()},()=>{clearTimeout(to);LB.ready=true;refreshLB()});
    if(S.nick)syncScore();
  }catch(e){LB.db=null}
}
function refreshLB(){const t=document.getElementById('lbtile');if(t)t.hidden=!LB.db;const rl=document.getElementById('rankslot');if(rl)rl.innerHTML=rankLine();if(document.getElementById('lbscreen'))lbScreen.render()}
async function syncScore(){
  if(!LB.db||!LB.me||!S.nick)return;
  const mine={xp:S.edx[ED]||0,weekXp:weekXp(),wk:weekKey(),speedBest:S.best,mastered:S.bosses||0};S.lbE.psle=mine;
  const doc={nick:S.nick,av:safeAv(S.av),pet:S.pet,world:tier(),updated:Date.now(),psle:mine,xp:mine.xp,weekXp:mine.weekXp,wk:mine.wk,speedBest:mine.speedBest,mastered:mine.mastered};
  const key=JSON.stringify({...doc,updated:0});if(key===LB.last)return;
  if(LB.busy){LB.pending=true;return}LB.busy=true;
  try{await LB.db.doc('scores/'+LB.me).set(doc);LB.last=key}catch(e){}
  LB.busy=false;if(LB.pending){LB.pending=false;syncScore()}
}
function askNick(then){
  main.innerHTML=`<div class="card"><span class="tag">Join the leaderboard</span><div class="word" style="font-size:clamp(28px,6vw,40px)">Pick your player name</div>
  <p>Your classmates will see this name. Use 2 to 14 letters or numbers, no spaces. Don’t use your full real name.</p>
  <form id="nf"><input class="inp" id="nn" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Player name" value="${esc(S.nick||'')}"><p id="ne" style="color:var(--bad,#d43b3b);font-weight:800;min-height:1.4em;margin:8px 0 0"></p><button class="go">Save name</button></form>
  <button class="go" id="h" style="background:var(--soft)">Back</button></div>`;
  $('nn').focus();$('h').onclick=home;
  $('nf').onsubmit=e=>{e.preventDefault();const v=$('nn').value.trim();if(!nickOk(v)){$('ne').textContent='That name won’t work. Try 2 to 14 letters or numbers, and keep it friendly.';return}
    S.nick=v;save();LB.last='';syncScore();then()};
}
const lbScreen={tab:'week',render(){
  const el=document.getElementById('lbscreen');if(!el)return;
  const b=BOARDS.find(x=>x[0]===this.tab);
  if(!LB.ready){el.innerHTML='<p class="q" style="text-align:center">Loading the board…</p>';return}
  const rows=boardRows(b[2]).slice(0,50);
  el.innerHTML=rows.length?`<ol class="lb">${rows.map((r,i)=>`<li class="${r.id===LB.me?'mine':''} ${i<3?'p'+(i+1):''}"><span class="rk">${i+1}</span><span class="who">${avatar(22,r.av)}${petSVG(r.pet,18)}</span><span class="nk"><span data-nick="${i}"></span><small class="wd">${esc(WORLDS[r.world||0][1])}</small></span><span class="sc"><b>${r.v}</b> ${b[3]}</span></li>`).join('')}</ol>`:'<p class="q" style="text-align:center">Be the first on the board!</p>';
  el.querySelectorAll('[data-nick]').forEach(s=>{const r=rows[+s.dataset.nick];s.textContent=(r.nick||'Player')+(r.sup?' 🏅':'')+(r.id===LB.me?' (you)':'')});
}};
function leaderboard(){
  if(!LB.db)return home();
  if(!S.nick)return askNick(leaderboard);
  hud();syncScore();
  main.innerHTML=`<div class="card"><span class="tag">Vocab Obby leaderboard</span><div class="word" style="font-size:clamp(28px,6vw,40px)">Leaderboard</div><p style="margin:0 0 6px;color:var(--mut);font-size:14px">XP comes from right answers, combos, streaks and bosses beaten. Everyone gets words picked just for them, so anyone can top the board.</p>
  ${rankLine()}<div class="tabs" role="tablist">${BOARDS.map(b=>`<button class="tab ${b[0]===lbScreen.tab?'on':''}" data-t="${b[0]}" role="tab">${b[1]}</button>`).join('')}</div>
  <div id="lbscreen"></div><p style="color:var(--mut);font-size:14px;margin:10px 0 0">Playing as <b id="mynick"></b> · <button class="linkbtn" id="ren">Change name</button></p>
  <button class="go" id="h">Home</button></div>`;
  $('mynick').textContent=S.nick;$('ren').onclick=()=>askNick(leaderboard);$('h').onclick=home;
  main.querySelectorAll('[data-t]').forEach(t=>t.onclick=()=>{lbScreen.tab=t.dataset.t;main.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===t));lbScreen.render()});
  lbScreen.render();
}
function applySup(){const me=window.VO&&window.VO.me;const t=me&&me.type==='kid'&&['any','10','20'].includes(me.sup)?me.sup:'';if(!t){if(S.sup){S.sup='';S.av.cape=false;save()}return}
  S.sup=t;S.av.cape=t!=='any';if(t==='20'&&!S.pets.includes(13)){S.pets.push(13)}
  if(S.supThx!==t){S.supThx=t;setTimeout(()=>{main.insertAdjacentHTML('afterbegin',`<div class="card" id="thx" style="margin-bottom:14px"><span class="tag">A note from Miss Christine</span><p style="font-size:17px;margin:10px 0">Thank you for supporting Vocab Obby! Your family helps me keep building new worlds, bosses and words for my students. 💛</p><p style="margin:0 0 6px">You got: 🏅 Supporter badge${t!=='any'?' · Golden Cape':''}${t==='20'?' · Thank-You Phoenix pet · Early access':''}</p><button class="go" id="thxok">Yay!</button></div>`);const b=document.getElementById('thxok');if(b)b.onclick=()=>{const c=document.getElementById('thx');if(c)c.remove()};confetti(120)},900)}
  save();hud()}
if(window.VO_READY)window.VO_READY.then(applySup).catch(()=>{});
applySkin();setTitle();fetch(EDF[ED]).then(r=>r.json()).then(d=>{W=d;addAuto();splashOut();const qp=new URLSearchParams(location.search).get('quest');if(qp&&ED&&S.lad&&S.lad.placed){history.replaceState(null,'',location.pathname);joinQuest(qp)}else if(location.hash==='#quests'&&ED&&S.lad&&S.lad.placed){history.replaceState(null,'',location.pathname);worldmap()}else home();lbInit()}).catch(()=>{splashOut();main.innerHTML='<div class="card"><p class="q">Could not load the word list. Please refresh.</p></div>'});
})</script></body></html>
