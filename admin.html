<!doctype html><html lang="en-SG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VocaBobby admin</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f3f6fc;color:#1b2140}.w{max-width:620px;margin:0 auto;padding:16px}.card{background:#fff;border:3px solid #1b2140;border-radius:14px;padding:16px;margin:12px 0}input,select,button{font:inherit;padding:10px;border-radius:10px;border:2px solid #1b2140;min-height:44px}input{width:100%;box-sizing:border-box;margin:4px 0 10px}button{background:#ffd23f;font-weight:800;cursor:pointer}.err{color:#c0262d;font-weight:700}.ok{color:#178a3e;font-weight:700}label{font-weight:700}.kid{display:flex;gap:8px;align-items:center;margin:6px 0}.kid input{width:auto;min-height:0}small{color:#556}</style><link rel="stylesheet" href="/vb-light.css"><script src="/skin.js"></script></head>
<body><div class="w"><h1>VocaBobby admin</h1>
<div class="card" id="kc"><label for="key">Admin key</label><input id="key" type="password" autocomplete="off"><button id="ks">Use key</button><p><small>The key stays in this browser tab only and is forgotten when you close it.</small></p></div>
<div class="card"><label for="code">Family code</label><input id="code" autocapitalize="characters" autocomplete="off" placeholder="e.g. AB12CD"><button id="find">Find family</button><p class="err" id="e"></p><div id="fam"></div></div>
<div class="card"><label for="bhn">Bug Hunter codes (one-time, cosmetic badge + goggles, no coins)</label><input id="bhn" type="number" min="1" max="50" value="5"><input id="bhnote" placeholder="Note, e.g. P5 tester" maxlength="60"><button id="bhgo">Generate codes</button><p><small>Each code works once. Copy them now: they are stored hashed and cannot be shown again.</small></p><pre id="bhout" style="white-space:pre-wrap;font-size:18px"></pre></div>
</div><script>{
const $=s=>document.querySelector(s);let K=sessionStorage.getItem('vo_ak')||'';
const t=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#ks').onclick=()=>{K=$('#key').value.trim();sessionStorage.setItem('vo_ak',K);$('#e').textContent='Key set.'};
const call=(m,u,b)=>fetch(u,{method:m,headers:{'x-admin-key':K,'Content-Type':'application/json','x-vo':'1'},body:b?JSON.stringify(b):undefined}).then(async r=>({ok:r.ok,j:await r.json().catch(()=>({}))}));
const yr=()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10)};
function show(f){const paid=f.paid&&f.paid.until>Date.now();
  $('#fam').innerHTML=`<h2>Family ${t(f.code)}</h2><p>${t(f.email)}</p><p>Status: <b class="${paid?'ok':''}">${paid?(f.paid.plan==='family'?'Family Pass':'Paid players')+' until '+new Date(f.paid.until).toLocaleDateString('en-SG'):'Not paid'}</b></p>
  <h3>Unlock PSLE Edition</h3><label><input type="radio" name="pl" value="child" checked style="width:auto;min-height:0"> Per player (S$29.90 each)</label><br><label><input type="radio" name="pl" value="family" style="width:auto;min-height:0"> Family Pass (S$59.90, up to 3)</label>
  <div id="kids">${f.children.map(k=>`<div class="kid"><input type="checkbox" value="${t(k.id)}" ${paid&&(f.paid.plan==='family'||(f.paid.children||[]).includes(k.id))?'checked':''}> ${t(k.nick)}</div>`).join('')||'<p><small>No players yet.</small></p>'}</div>
  <label for="until">Paid until</label><input id="until" type="date" value="${yr()}"><label for="note">Note (e.g. PayNow ref / date)</label><input id="note" maxlength="120">
  <button id="un">Mark paid and unlock</button> <button id="rv" style="background:#eee">Remove access</button><p id="m"></p>
  <h3>Supporter (Support Miss Christine)</h3><p>Now: <b>${f.supporter&&f.supporter.tier?({any:'Any amount',10:'S$10+',20:'S$20+'})[f.supporter.tier]+(f.supporter.since?' since '+new Date(f.supporter.since).toLocaleDateString('en-SG'):''):'None'}</b>${f.supporter&&f.supporter.wall?' · on Supporters Wall':''}</p>
  <label for="tier">Tier</label><select id="tier"><option value="">None</option><option value="any">Any amount: badge + thank-you note</option><option value="10">S$10+: badge + Golden Cape</option><option value="20">S$20+: badge + Cape + Thank-You Phoenix + Early access</option></select>
  <label for="sdate">Date received</label><input id="sdate" type="date" value="${new Date().toISOString().slice(0,10)}"><button id="sup">Save supporter tier</button><p id="sm"></p>`;
  if(f.supporter&&f.supporter.tier)$('#tier').value=f.supporter.tier;
  $('#sup').onclick=async()=>{const r=await call('POST','/api/admin',{action:'supporter',code:f.code,tier:$('#tier').value,date:$('#sdate').value});if(r.ok){show(r.j.family);$('#sm').className='ok';$('#sm').textContent='Saved. Rewards appear next time the player opens the game.'}else{$('#sm').className='err';$('#sm').textContent=r.j.error||'Failed'}};
  $('#un').onclick=async()=>{const plan=document.querySelector('[name=pl]:checked').value;const ids=[...document.querySelectorAll('#kids input:checked')].map(i=>i.value);
    const r=await call('POST','/api/admin',{action:'unlock',code:f.code,plan,childIds:ids,until:$('#until').value,note:$('#note').value});if(r.ok){show(r.j.family);$('#m').className='ok';$('#m').textContent='Unlocked. The player sees it next time they open the game.'}else{$('#m').className='err';$('#m').textContent=r.j.error||'Failed'}};
  $('#rv').onclick=async()=>{if(!window.confirm)return;const r=await call('POST','/api/admin',{action:'revoke',code:f.code});if(r.ok)show(r.j.family)};}
$('#find').onclick=async()=>{$('#e').textContent='';$('#fam').innerHTML='';const c=$('#code').value.trim().toUpperCase();if(!c)return;const r=await call('GET','/api/admin?code='+encodeURIComponent(c));if(r.ok)show(r.j.family);else $('#e').textContent=r.j.error||'Not found'};
if(K)$('#e').textContent='Key loaded for this tab.';
}
(function(){const box=document.createElement('div');box.className='card';box.innerHTML='<h2>Word bank: auto-added</h2><p>Words built from My Lists that appeared in 3 different lists. Remove any you don\'t want.</p><button id="ld">Load</button><div id="ab"></div>';document.body.appendChild(box);
document.getElementById('ld').onclick=async()=>{const r=await call('GET','/api/admin?bank=1');const d=document.getElementById('ab');if(!r.ok){d.textContent=(r.j&&r.j.error)||'Error';return}
d.innerHTML='<ul>'+r.j.auto.map(x=>'<li><b>'+x.w+'</b> <span class="tag">auto-added</span> '+x.level+' · '+x.meaning.replace(/</g,'&lt;')+' · '+x.lists+' lists <button data-rm="'+x.w+'">Remove</button></li>').join('')+'</ul><details><summary>Log</summary><pre>'+r.j.log.map(e=>new Date(e.at).toISOString().slice(0,16)+' '+e.t+' '+e.w+(e.n?' ('+e.n+')':'')).join('\n')+'</pre></details>';
d.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await call('POST','/api/admin',{action:'removeAuto',w:b.dataset.rm});b.parentNode.remove()})}})();
(function(){const box=document.createElement('div');box.className='card';box.innerHTML='<h2>Bug reports</h2><p>Reports from players. Award = matched a real logged incident from that device (new signature) and won Bug Hunter.</p><button id="bgl">Load reports</button><div id="bgo"></div>';document.querySelector('.w').appendChild(box);
document.getElementById('bgl').onclick=async()=>{const r=await call('GET','/api/x?r=bug');const d=document.getElementById('bgo');if(!r.ok){d.textContent=(r.j&&r.j.error)||'Error';return}d.innerHTML=r.j.reports.length?'<ul>'+r.j.reports.map(x=>'<li><b>'+new Date(x.at).toLocaleString('en-SG')+'</b> '+(x.award?'<span class="ok">Bug Hunter awarded</span>':'thanks')+'<br>'+t(x.text)+(x.match?'<br><small>Incident: '+t(x.match.kind+': '+x.match.msg)+'</small>':'')+'<br><small>'+t(x.ua||'')+'</small></li>').join('')+'</ul>':'<p>No reports yet.</p>'}})();
$('#bhgo').onclick=async()=>{const r=await call('POST','/api/admin',{action:'bhGen',n:+$('#bhn').value,note:$('#bhnote').value});$('#bhout').textContent=r.ok?r.j.codes.join('\n'):(r.j.error||'Failed')};
</script></body></html>
